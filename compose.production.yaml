name: pool-production

# 单实例部署；不要与开发 compose.yaml 合并使用。
x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?请配置容器内 DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?请配置容器内 REDIS_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?请配置 BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?请配置公网 HTTPS 地址}

services:
  web:
    image: pool-web:${POOL_IMAGE_TAG:-local}
    build:
      context: .
      target: web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.13.0-slim}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    environment:
      <<: *server-env
      AUTH_TRUST_PROXY: 'true'
      MUSIC_API_BASE_URL: http://music:3000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://ws-hmgfth5uyiijbxu5.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.8-flash}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      music:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    init: true
    stop_grace_period: 100s
    restart: unless-stopped

  socket:
    image: pool-socket:${POOL_IMAGE_TAG:-local}
    build:
      context: .
      target: socket
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.13.0-slim}
    environment:
      <<: *server-env
      SOCKET_HOST: 0.0.0.0
      SOCKET_PORT: '3002'
    ports:
      - '127.0.0.1:${SOCKET_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  music:
    image: pool-music:${POOL_IMAGE_TAG:-local}
    build:
      context: ./vendor/api-enhanced
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${MUSIC_NODE_IMAGE:-node:lts-alpine}
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      NETEASE_COOKIE: ''
      ENABLE_GENERAL_UNBLOCK: 'false'
    healthcheck:
      # 静态入口，不调用网易云；启动时生成匿名凭据可能耗时。
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请配置 POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: pool-migrate:${POOL_IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.13.0-slim}
    profiles: [tools]
    environment:
      DATABASE_URL: ${DATABASE_URL:?请配置容器内 DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
